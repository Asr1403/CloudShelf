<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Books - Online Library</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 22px;
            text-align: center;
        }

        main {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px #0001;
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin: 5px;
        }

        button,
        .btn {
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .delete {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <header>
        <h1>Library Book Management</h1>
        <p>Add, search, and manage library books</p>
    </header>

    <main>
        <a class="btn" href="/">Back to Dashboard</a>

        <section class="panel">
            <h2>Add New Book</h2>

            <form th:action="@{/books/add}" th:object="${book}" method="post">
                <input type="text" th:field="*{title}" placeholder="Book Title" required>

                <input type="text" th:field="*{author}" placeholder="Author" required>

                <input type="text" th:field="*{category}" placeholder="Category" required>

                <button type="submit">Add Book</button>

                <p class="error" th:if="${#fields.hasErrors('*')}">
                    Please enter all required book details.
                </p>
            </form>
        </section>

        <section class="panel">
            <h2>Available Library Books</h2>

            <form th:action="@{/books}" method="get">
                <input type="text" name="search" th:value="${search}" placeholder="Search by book title">

                <button type="submit">Search</button>
                <a class="btn" href="/books">Clear</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${books}">
                            <td th:text="${b.id}"></td>
                            <td th:text="${b.title}"></td>
                            <td th:text="${b.author}"></td>
                            <td th:text="${b.category}"></td>
                            <td th:text="${b.available ? 'Available' : 'Issued'}"></td>
                            <td>
                                <form th:action="@{/books/delete/{id}(id=${b.id})}" method="post"
                                    onsubmit="return confirm('Delete this book?')">
                                    <button class="delete" type="submit">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="6">No books found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
